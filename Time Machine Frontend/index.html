<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Time Machine — Travel to your past, or to 2050</title>
    <meta
      name="description"
      content="Two doors. Step back into an imagined past life, or forward into the year 2050. Time Machine writes you a chronicle and paints you a portrait on either side of now."
    />
    <meta name="theme-color" content="#06080F" />
    <meta name="color-scheme" content="dark light" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2306080F'/><circle cx='50' cy='50' r='30' fill='none' stroke='%235EF2FF' stroke-width='4'/><path d='M50 30 V50 L64 58' fill='none' stroke='%23C9A227' stroke-width='5' stroke-linecap='round'/></svg>"
    />

    <!--
      Two typographic worlds, chosen so a reader knows which one they are in
      before reading a word.

        Past    Fraunces (display) · Cinzel (small caps) · Spectral (text)
                A high-contrast variable serif with a soft, slightly wonky
                cut — period printing rather than generic elegance.

        2050    Unbounded (display) · Space Grotesk (text) · JetBrains Mono
                Wide geometric forms with tight tracking, which is what gives
                the year its weight at hero size.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,400..700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&family=Unbounded:wght@300..900&display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Time Machine — Travel to your past, or to 2050" />
    <meta
      property="og:description"
      content="Two doors. One takes you back. One takes you to 2050. Which do you want to know?"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
